name: Android CI
on:
  push:
  pull_request:

jobs:
  android-library:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android toolchain
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" \
            "cmake;3.22.1" "ndk;27.2.12479018"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Compile and lint Android library
        run: gradle --no-daemon --stacktrace :android:arkernel:assembleDebug :android:arkernel:lintDebug
      - name: Upload lint report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: android/arkernel/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 7
