name: Android CI
on:
  push:
  pull_request:

jobs:
  android-library:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android toolchain
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" \
            "cmake;3.22.1" "ndk;27.2.12479018"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Compile, test, and lint Android library
        shell: bash
        run: |
          set +e
          gradle --no-daemon --stacktrace --max-workers=2 \
            -Dorg.gradle.jvmargs=-Xmx3g \
            :android:arkernel:assembleDebug \
            :android:arkernel:testDebugUnitTest :android:arkernel:lintDebug \
            2>&1 | tee android-library-gradle.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo '### Android library Gradle failure'
              echo '```text'
              tail -n 160 android-library-gradle.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            detail=$(grep -E '^e: ' android-library-gradle.log | head -n 40)
            if [ -z "$detail" ]; then
              detail=$(grep -E 'error:' \
                android-library-gradle.log | head -n 40)
            fi
            if [ -z "$detail" ]; then
              detail=$(awk '/FAILURE: Build failed/{f=1} f' \
                android-library-gradle.log | head -n 40)
            fi
            detail=${detail//'%'/'%25'}
            detail=${detail//$'\r'/'%0D'}
            detail=${detail//$'\n'/'%0A'}
            echo "::error title=Android library Gradle failure::$detail"
          fi
          exit "$status"
      - name: Upload lint report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-ci-reports
          path: |
            android-library-gradle.log
            android/arkernel/build/reports/lint-results-debug.*
            android/arkernel/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: ignore
          retention-days: 7

  android-instrumented:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android native toolchain
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" \
            "cmake;3.22.1" "ndk;27.2.12479018"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run JNI instrumentation smoke test on API 35
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: default
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated
          script: bash ci/run_android_instrumented.sh
      - name: Upload instrumentation reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumentation-reports
          path: |
            android/arkernel/build/reports/androidTests/connected/**
            android/arkernel/build/outputs/androidTest-results/connected/**
          if-no-files-found: ignore
          retention-days: 7

  diagnostics-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android toolchain
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" \
            "cmake;3.22.1" "ndk;27.2.12479018"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Verify high-rate sensor permission
        shell: bash
        run: |
          set -e
          grep -q 'android.permission.HIGH_SAMPLING_RATE_SENSORS' \
            android/diagnostics-app/src/main/AndroidManifest.xml
      - name: Build diagnostics APK
        shell: bash
        run: |
          set +e
          gradle --no-daemon --stacktrace --max-workers=2 \
            -Dorg.gradle.jvmargs=-Xmx2g \
            :android:diagnostics-app:assembleDebug \
            2>&1 | tee diagnostics-apk-gradle.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo '### Diagnostics APK build failure'
              echo '```text'
              tail -n 160 diagnostics-apk-gradle.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # Compiler diagnostics first: they say what is actually wrong.
            # The Gradle stack is only a fallback when nothing was found.
            detail=$(grep -E '^e: ' diagnostics-apk-gradle.log | head -n 40)
            if [ -z "$detail" ]; then
              detail=$(grep -E '^w: .*error|error:' \
                diagnostics-apk-gradle.log | head -n 40)
            fi
            if [ -z "$detail" ]; then
              detail=$(awk '/FAILURE: Build failed/{f=1} f' \
                diagnostics-apk-gradle.log | head -n 20)
            fi
            detail=${detail//'%'/'%25'}
            detail=${detail//$'\r'/'%0D'}
            detail=${detail//$'\n'/'%0A'}
            echo "::error title=Diagnostics APK build failure::$detail"
          fi
          exit "$status"
      - name: Prepare named diagnostics APK
        shell: bash
        run: |
          set -e
          SRC=$(find android/diagnostics-app/build/outputs/apk/debug \
            -maxdepth 1 -type f -name '*.apk' \
            ! -name 'arkernel-diagnostics-debug.apk' | head -n 1)
          test -n "$SRC"
          cp "$SRC" \
            android/diagnostics-app/build/outputs/apk/debug/arkernel-diagnostics-debug.apk
          ls -lh \
            android/diagnostics-app/build/outputs/apk/debug/arkernel-diagnostics-debug.apk
          VERSION=$(awk -F'"' '/versionName/ { print $2; exit }' \
            android/diagnostics-app/build.gradle.kts)
          test -n "$VERSION"
          cp "$SRC" \
            "android/diagnostics-app/build/outputs/apk/debug/arkernel-diagnostics-debug-$VERSION.apk"
      - name: Upload diagnostics APK
        uses: actions/upload-artifact@v4
        with:
          name: arkernel-diagnostics-apk
          path: android/diagnostics-app/build/outputs/apk/debug/arkernel-diagnostics-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish diagnostics APK release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="diagnostics-apk-latest"
          APK="android/diagnostics-app/build/outputs/apk/debug/arkernel-diagnostics-debug.apk"
          VERSION=$(awk -F'"' '/versionName/ { print $2; exit }' \
            android/diagnostics-app/build.gradle.kts)
          VERSIONED="android/diagnostics-app/build/outputs/apk/debug/arkernel-diagnostics-debug-$VERSION.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$VERSIONED" --clobber
          else
            gh release create "$TAG" "$APK" "$VERSIONED" \
              --target "$GITHUB_SHA" \
              --title "AR-Kern Diagnose APK (latest)" \
              --notes "Single installed ARKFDPLAN1 plan-driven diagnostics app for sideloading on a physical device. Writes opted-in ARKFDPOL1, ARKFDPLAN1 and ARKFDLOG1 text files; declares HIGH_SAMPLING_RATE_SENSORS for SENSOR_DELAY_FASTEST sensor tests. Debug build, quality unverified; no images, poses, trajectories, automatic upload or physical accuracy claims. See android/diagnostics-app/README.md."
          fi
